{% extends "base.html" %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<form method="post" class="card">{% csrf_token %}
  <div class="card-body">
    <div class="row">
      <div class="col-lg-8 col-xl-6">{% include "partials/form_fields.html" %}</div>
    </div>
  </div>
  <div class="card-footer text-end">
    <a class="btn" href="{% if event %}{{ event.get_absolute_url }}{% else %}{% url 'events:list' %}{% endif %}">Cancel</a>
    <button class="btn btn-primary">Save event</button>
  </div>
</form>
{% endblock %}
